<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">AI Option Scanner Logo</title>
  <desc id="desc">A neon green vector mark combining an options chart, AI node grid, and upward price arrow.</desc>
  <defs>
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="fade" x1="56" x2="200" y1="212" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.18" />
      <stop offset="1" stop-color="#34d399" stop-opacity="0.88" />
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="34" fill="#101214" />
  <path d="M40 176V72c0-17.7 14.3-32 32-32h112c17.7 0 32 14.3 32 32v112c0 17.7-14.3 32-32 32H80" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
  <path d="M68 178c20-45 34-66 52-64 17 2 22 25 38 24 14-1 24-22 42-58" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)" />
  <path d="M178 80h22v22" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M72 78h112M72 128h112M72 178h64" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.16" />
  <path d="M96 58v140M144 58v140M192 82v92" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" opacity="0.12" />
  <circle cx="78" cy="178" r="7" fill="#34d399" filter="url(#neon)" />
  <circle cx="120" cy="114" r="7" fill="#34d399" filter="url(#neon)" />
  <circle cx="158" cy="138" r="7" fill="#34d399" filter="url(#neon)" />
  <circle cx="200" cy="80" r="7" fill="#34d399" filter="url(#neon)" />
  <path d="M68 204h120c9 0 17-4 22-11" fill="none" stroke="url(#fade)" stroke-width="8" stroke-linecap="round" />
  <path d="M78 96c0-9 7-16 16-16h20c9 0 16 7 16 16v64c0 9-7 16-16 16H94c-9 0-16-7-16-16V96Z" fill="#101214" stroke="#34d399" stroke-width="5" opacity="0.92" />
